services:
  - type: web
    name: nath-vintage-hub
    runtime: static
    repo: https://github.com/mrallotey/NATH-VINTAGE-HUB
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /owner
        name: Cache-Control
        value: no-store
      - path: /owner/*
        name: Cache-Control
        value: no-store
      - path: /owner/index.html
        name: Cache-Control
        value: no-store
